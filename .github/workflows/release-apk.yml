# Builds a release APK on every push to main and publishes it as a rolling
# "nightly" GitHub pre-release you can download and sideload. Pushing a `v*`
# tag instead cuts a normal versioned release.
#
# Uses a third-party action (subosito/flutter-action) pinned to a commit SHA.
name: Release APK

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-apk-${{ github.ref }}
  # Let an in-flight release finish rather than leaving the rolling "nightly"
  # release half-updated; a rapid follow-up push just queues behind it.
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build & publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: "3.47.0"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Generated sources (*.g.dart / *.freezed.dart) are committed to the repo,
      # so CI builds against those. Run build_runner locally after touching an
      # annotated source.
      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Resolve build metadata
        id: meta
        run: |
          set -euo pipefail
          version_field="$(grep -E '^version:[[:space:]]' pubspec.yaml | awk '{print $2}')"
          app_version="${version_field%%+*}"
          short_sha="${GITHUB_SHA::7}"
          {
            echo "app_version=${app_version}"
            echo "short_sha=${short_sha}"
            echo "apk_name=arrstack-v${app_version}-build${GITHUB_RUN_NUMBER}-${short_sha}.apk"
          } >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "channel=tagged" >> "$GITHUB_OUTPUT"
          else
            echo "channel=nightly" >> "$GITHUB_OUTPUT"
          fi

      # Debug-signed (Flutter's default). Fine for personal sideloading; not
      # for Play Store. To switch to a real keystore, add a release
      # signingConfig in android/app/build.gradle.kts fed from secrets and
      # materialize the keystore here before this step.
      - name: Build release APK
        run: >
          flutter build apk --release
          --build-name "${{ steps.meta.outputs.app_version }}"
          --build-number "${{ github.run_number }}"

      - name: Stage APK
        id: apk
        run: |
          set -euo pipefail
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/${{ steps.meta.outputs.apk_name }}"
          echo "path=dist/${{ steps.meta.outputs.apk_name }}" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.apk_name }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 90

      - name: Compose release notes
        run: |
          cat > release-notes.md <<EOF
          Automated build of \`${GITHUB_SHA}\`.

          | | |
          |---|---|
          | App version | \`${{ steps.meta.outputs.app_version }}\` |
          | Build number | \`${{ github.run_number }}\` |
          | Commit | [\`${{ steps.meta.outputs.short_sha }}\`](${{ github.server_url }}/${{ github.repository }}/commit/${GITHUB_SHA}) |
          | Built | $(date -u +'%Y-%m-%d %H:%M UTC') |

          Debug-signed APK for personal sideloading. Android will ask you to
          allow installs from your browser or file manager the first time.
          EOF

      - name: Publish nightly pre-release
        if: steps.meta.outputs.channel == 'nightly'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Roll the single "nightly" release forward to this commit.
          gh release delete nightly --cleanup-tag --yes || true
          sleep 5
          gh release create nightly \
            --title "Nightly · ${{ steps.meta.outputs.short_sha }}" \
            --notes-file release-notes.md \
            --prerelease \
            --target "${GITHUB_SHA}" \
            "${{ steps.apk.outputs.path }}"

      - name: Publish tagged release
        if: steps.meta.outputs.channel == 'tagged'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            --latest \
            "${{ steps.apk.outputs.path }}"
