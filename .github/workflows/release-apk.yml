# Builds a release APK on every push to main and publishes it as a rolling
# "nightly" GitHub pre-release you can download and sideload. Pushing a `v*`
# tag instead cuts a normal versioned release.
#
# Uses a third-party action (subosito/flutter-action) pinned to a commit SHA.
name: Release APK

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-apk-${{ github.ref }}
  # Let an in-flight release finish rather than leaving the rolling "nightly"
  # release half-updated; a rapid follow-up push just queues behind it.
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build & publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: "3.47.0"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Generated sources (*.g.dart / *.freezed.dart) are committed to the repo,
      # so CI builds against those. Run build_runner locally after touching an
      # annotated source.
      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Resolve build metadata
        id: meta
        run: |
          set -euo pipefail
          version_field="$(grep -E '^version:[[:space:]]' pubspec.yaml | awk '{print $2}')"
          app_version="${version_field%%+*}"
          short_sha="${GITHUB_SHA::7}"
          {
            echo "app_version=${app_version}"
            echo "short_sha=${short_sha}"
            echo "apk_name=arrstack-v${app_version}-build${GITHUB_RUN_NUMBER}-${short_sha}.apk"
          } >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "channel=tagged" >> "$GITHUB_OUTPUT"
          else
            echo "channel=nightly" >> "$GITHUB_OUTPUT"
          fi

      # Materializes the persistent release keystore from a repo secret so
      # every build — nightly and tagged alike — signs with the same
      # identity. Without this, Android refuses to install a new build over
      # an existing one (different signing cert = different app identity).
      #
      # Credentials are passed to the build step as environment variables,
      # not written into android/key.properties: that file is parsed with
      # Java's Properties format, which interprets backslashes and line
      # breaks in values instead of preserving them, silently corrupting
      # any password/alias containing either and breaking every subsequent
      # signed build (android/app/build.gradle.kts reads env vars first).
      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "${ANDROID_KEYSTORE_BASE64}" ]]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is empty or unset. Add it in Settings > Secrets and variables > Actions." >&2
            exit 1
          fi
          echo "${ANDROID_KEYSTORE_BASE64}" | base64 -d > "${GITHUB_WORKSPACE}/android/app/release.jks"

      # Fails fast (seconds, not ~5 minutes into the Gradle build) with a
      # clear message when the keystore secret is missing, empty, or
      # corrupted in transit (e.g. mangled by a copy-paste through a
      # browser secret field), instead of surfacing as an opaque
      # KeytoolException deep inside :app:packageRelease.
      #
      # Validates with a real (throwaway) jarsigner operation rather than
      # `keytool -list`: -list only opens the keystore with the store
      # password and never touches the private key, so a wrong or empty
      # ANDROID_KEY_PASSWORD would pass that check and still only fail
      # later, mid Gradle build (confirmed locally — keytool even ignores
      # -keypass entirely for PKCS12 keystores). jarsigner performs the
      # same private-key unlock Gradle's signing step does.
      - name: Verify release keystore
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          keystore_path="${GITHUB_WORKSPACE}/android/app/release.jks"
          if [[ ! -s "${keystore_path}" ]]; then
            echo "::error::${keystore_path} is empty — ANDROID_KEYSTORE_BASE64 didn't decode to any content." >&2
            exit 1
          fi
          verify_dir="$(mktemp -d)"
          trap 'rm -rf "${verify_dir}"' EXIT
          echo probe > "${verify_dir}/probe.txt"
          (cd "${verify_dir}" && jar cf probe.jar probe.txt)
          if ! jarsigner \
              -keystore "${keystore_path}" \
              -storepass "${ANDROID_KEYSTORE_PASSWORD}" \
              -keypass "${ANDROID_KEY_PASSWORD}" \
              "${verify_dir}/probe.jar" "${ANDROID_KEY_ALIAS}" > /dev/null; then
            echo "::error::Release keystore failed to validate — check ANDROID_KEYSTORE_BASE64, ANDROID_KEY_ALIAS, ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_PASSWORD secrets." >&2
            exit 1
          fi
          echo "Release keystore OK (alias: ${ANDROID_KEY_ALIAS})"

      - name: Build release APK
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/app/release.jks
        run: >
          flutter build apk --release
          --build-name "${{ steps.meta.outputs.app_version }}"
          --build-number "${{ github.run_number }}"

      - name: Stage APK
        id: apk
        run: |
          set -euo pipefail
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/${{ steps.meta.outputs.apk_name }}"
          echo "path=dist/${{ steps.meta.outputs.apk_name }}" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.apk_name }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 90

      - name: Compose release notes
        run: |
          cat > release-notes.md <<EOF
          Automated build of \`${GITHUB_SHA}\`.

          | | |
          |---|---|
          | App version | \`${{ steps.meta.outputs.app_version }}\` |
          | Build number | \`${{ github.run_number }}\` |
          | Commit | [\`${{ steps.meta.outputs.short_sha }}\`](${{ github.server_url }}/${{ github.repository }}/commit/${GITHUB_SHA}) |
          | Built | $(date -u +'%Y-%m-%d %H:%M UTC') |

          Signed with the ArrStack Companion release key for personal
          sideloading — installs in place over prior releases. Android will
          ask you to allow installs from your browser or file manager the
          first time.
          EOF

      - name: Publish nightly pre-release
        if: steps.meta.outputs.channel == 'nightly'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Roll the single "nightly" release forward to this commit.
          gh release delete nightly --cleanup-tag --yes || true
          sleep 5
          gh release create nightly \
            --title "Nightly · ${{ steps.meta.outputs.short_sha }}" \
            --notes-file release-notes.md \
            --prerelease \
            --target "${GITHUB_SHA}" \
            "${{ steps.apk.outputs.path }}"

      - name: Publish tagged release
        if: steps.meta.outputs.channel == 'tagged'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            --latest \
            "${{ steps.apk.outputs.path }}"
